{% macro chip(actor_id, root) -%}
{%- set a = actors[actor_id] -%}
<a class="chip {{ 'country' if a.is_country else 'org' }}" href="{{ root }}/actor/{{ a.page }}.html">{{ a.name }}</a>
{%- endmacro %}

{% macro map(iso_ids, root, id="map") -%}
<div class="map" id="{{ id }}" data-lit='{{ iso_ids | tojson }}'></div>
{%- endmacro %}

{% macro map_scripts(root) -%}
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="{{ root }}/static/map.js"></script>
{%- endmacro %}
